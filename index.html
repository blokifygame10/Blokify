<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blokify</title>
<style>
:root{--bg:#0b0f17;--cd:#161c28;--ln:#2a3345;--g:#2fa84f;--b:#2563eb;--t:#2ee6a6;--mu:#93a0b8;--tx:#fff;--in:#0e1420}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
[hidden]{display:none!important}.v{min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}
.ic{width:20px;height:20px;vertical-align:middle}.logo{font-weight:900;letter-spacing:1px}
#load{background:#fff;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center}
#load .logo{font-size:clamp(44px,12vw,90px)}#ld{position:fixed;bottom:12vh;color:#555}
.au{max-width:420px;margin:0 auto;padding:40px 22px;text-align:center}.au .logo{font-size:52px}.au h3{color:var(--t);margin:6px 0 22px}
.big{display:block;width:100%;padding:16px;border:0;border-radius:14px;font-weight:800;font-size:18px;margin:12px 0;color:#fff}.gr{background:var(--g)}.bl{background:var(--b)}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:var(--in);color:var(--tx);font:inherit;margin:6px 0}
label{display:block;text-align:left;font-size:14px;color:var(--mu);margin-top:10px}.row{display:flex;gap:8px}.er{color:#ff7a7a;min-height:20px;font-size:14px}
.gd button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--in)}.gd .on{border-color:var(--t);color:var(--t)}
.back{background:none;border:0;font-size:26px;float:left}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln)}header .logo{font-size:22px}
#sb{flex:1;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;color:var(--mu)}
.ib{background:none;border:0}.me{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:700}.av{width:34px;height:34px;border-radius:50%;background:#f5c9a0;border:2px solid var(--t)}
.lay{display:flex;min-height:calc(100vh - 57px)}nav{width:170px;padding:12px;border-right:1px solid var(--ln)}
nav button{display:flex;gap:10px;align-items:center;width:100%;padding:12px;margin-bottom:4px;border:0;border-radius:10px;background:none;text-align:left}nav .on{background:var(--cd);color:var(--t)}
main{flex:1;padding:18px;min-width:0}h2{margin:18px 0 10px}.rw{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.gc{flex:0 0 130px;cursor:pointer}.th{aspect-ratio:1;border-radius:22px;display:flex;align-items:flex-end;padding:8px;font-size:34px;font-weight:900;color:#ffffff66}.gc b{display:block;margin-top:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:9px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--cd)}.chips .on{background:var(--t);color:#062}
.gg{display:grid;grid-template-columns:repeat(auto-fill,130px);gap:14px;margin-top:14px}
.ml{display:flex;gap:16px;flex-wrap:wrap}.mt{width:150px}.mt button{display:block;width:100%;padding:11px;margin-bottom:4px;border:0;border-radius:10px;background:none;text-align:left}.mt .on{background:var(--cd);color:var(--t)}
.mc{flex:1;min-width:240px}.it{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:10px}.it button{border:2px solid var(--ln);border-radius:14px;background:var(--cd);padding:6px;font-size:12px}.it .on{border-color:var(--t)}.it i{display:block;height:52px;border-radius:8px;margin-bottom:4px}
.pv{width:260px}#cv{width:100%;height:340px;background:var(--cd);border-radius:18px}
.gh{border-radius:22px;padding:30px 16px;text-align:center}.gh .th{width:150px;margin:0 auto 10px}.play{width:220px}.pop{position:fixed;inset:0;background:#000b;z-index:9;padding:60px 18px;color:#fff}.pop input{max-width:520px;display:block;margin:0 auto 18px}
@media(max-width:700px){.lay{flex-direction:column-reverse}nav{width:100%;display:flex;border:0;border-top:1px solid var(--ln);position:sticky;bottom:0;background:var(--bg);padding:6px}nav button{flex-direction:column;font-size:11px;gap:2px;justify-content:center;text-align:center}.me span{display:none}}
.st{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.st small{display:block;color:var(--mu)}
.tg{width:52px;height:30px;border-radius:15px;border:0;background:#334155;position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on:after{left:25px}
.it img{display:block;width:100%;height:80px;object-fit:contain;background:var(--in);border-radius:8px;margin-bottom:4px}.it{grid-template-columns:repeat(auto-fill,100px)!important}
 
.pa{width:180px;height:180px;display:block;margin:0 auto;background:var(--cd);border-radius:24px}
.wr{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--cd)}.wr i{width:16px;height:16px;border-radius:50%;border:1px solid var(--ln)}
#aip{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 26%,#fff 0,#fff1e4 40%,#ffb877 100%);color:#2a1606;overflow:auto}
#aiw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.aic{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:78px 26px 50px;text-align:center}
.aic h1{margin:16px 0 4px;font-size:34px;letter-spacing:.5px}.aic p{margin:0 0 20px;color:#7a4a22}
.ailogo svg{filter:drop-shadow(0 0 14px #ff8a2b) drop-shadow(0 0 34px #ffb877);animation:gl 2.4s ease-in-out infinite alternate}
@keyframes gl{from{transform:scale(1)}to{transform:scale(1.08)}}
.aib{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin:10px 0;border-radius:16px;border:2px solid #ff8a2b;background:#fff;color:#2a1606;font-weight:800;font-size:17px}
.aib .dot{width:18px;height:18px;border-radius:50%;border:2px solid #2a1606}
#aip input{background:#fff;color:#2a1606;border-color:#ffb877}
.aix{position:fixed;top:calc(14px + env(safe-area-inset-top));left:18px;z-index:2;width:44px;height:44px;border-radius:50%;border:2px solid #ff8a2b;background:#fff;color:#2a1606;font-size:22px}
@media(prefers-reduced-motion:reduce){.ailogo svg{animation:none}}
 
#og{position:fixed;inset:0;z-index:30;background:#8fd3ff;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff;font-weight:700}
#ogv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#ogx{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:12px;border:0;background:#0007;font-size:20px}
#ogh,#ogt{position:absolute;right:12px;text-shadow:0 2px 4px #000}#ogh{top:calc(62px + env(safe-area-inset-top));background:#0006;padding:6px 10px;border-radius:10px;font-size:14px}
#ogt{top:30%;left:0;right:0;text-align:center;font-size:24px;opacity:0;transition:opacity .3s;pointer-events:none}
#ogc{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;width:min(270px,56vw)}
#ogm{background:#0005;border-radius:10px;padding:6px 8px;font-size:13px;min-height:20px;max-height:128px;overflow:hidden;text-shadow:0 1px 2px #000;font-weight:600}
#ogc .r{display:flex;gap:4px;margin-top:4px}#ogc input{margin:0;padding:8px;font-size:16px;flex:1;min-width:0;background:#000a;color:#fff;border-color:#fff3}#ogc button{border:0;border-radius:10px;background:#2fa84f;padding:0 12px}
#ogd{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template:repeat(3,58px)/repeat(3,58px);gap:4px}
#og [data-k]{border:0;border-radius:14px;background:#0008;color:#fff;font-size:22px;touch-action:none}
#ogj{position:absolute;right:22px;bottom:calc(30px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%!important;background:#2fa84fcc!important;font-size:16px!important}
#ogf{position:absolute;inset:0;background:#f00;opacity:0;transition:opacity .25s;pointer-events:none}
#ogw{position:absolute;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}#ogw .big{max-width:300px}
</style></head><body>
<section id="load" class="v"><div class="logo">BLOKIFY</div><div id="ld">Loading.</div></section>
 
<section id="welcome" class="v au" hidden><div class="logo">BLOKIFY</div><h3>PLAY. CREATE. EXPLORE.</h3>
<button class="big gr" data-go="signup">SIGN UP</button><button class="big bl" data-go="login">LOG IN</button><button class="big" style="background:#fff;color:#222" id="gw">Continue with Google</button><div class="er" id="we"></div></section>
 
<section id="login" class="v au" hidden><button class="back" data-go="welcome">&larr;</button><div class="logo">BLOKIFY</div><h3>Welcome back!<br><small style="color:var(--tx)">Log in to continue</small></h3>
<input id="lu" placeholder="Username" autocapitalize="none"><input id="lp" type="password" placeholder="Password"><div class="er" id="le"></div><button class="big bl" id="lg">LOG IN</button></section>
 
<section id="signup" class="v au" hidden><button class="back" data-go="welcome">&larr;</button><div class="logo">BLOKIFY</div><h3>SIGN UP AND START HAVING FUN!</h3>
<label>Birthday</label><div class="row"><select id="bm"></select><select id="bd"></select><select id="by"></select></div>
<label>Username</label><input id="su" placeholder="Don't use your real name" autocapitalize="none">
<label>Password</label><input id="sp" type="password" placeholder="At least 8 characters">
<label>Gender (optional)</label><div class="row gd" id="gd" style="flex-wrap:wrap"><button data-g="girl">Girl</button><button data-g="boy">Boy</button><button data-g="cat">Cat</button><button data-g="dog">Dog</button><button data-g="developer">Developer</button></div>
<div class="er" id="se"></div><button class="big gr" id="sg">SIGN UP</button></section>
 
<section id="app" class="v" hidden>
<header><span class="logo">BLOKIFY</span><button id="sb" data-i="search"> Search</button><button class="me" id="pf"><div class="av"></div><span id="nm"></span></button><button class="ib" id="ai" aria-label="Blokify AI"></button><button class="ib" id="bl" data-i="bell"></button><button class="ib" id="gr2" data-i="gear"></button></header>
<div class="lay"><nav id="nav"><button data-r="home" data-i="home">Home</button><button data-r="cats" data-i="grid">Categories</button><button data-r="mall" data-i="bag">Mall</button><button data-r="msg" data-i="chat">Messages</button><button data-r="create" data-i="edit">Create</button></nav><main id="mn"></main></div></section>
<div class="pop" id="pp" hidden></div>
<div id="aip" hidden><canvas id="aiw"></canvas><button class="aix" id="aix" aria-label="Close">&larr;</button><div class="aic"><div class="ailogo" id="ail"></div><h1>Blokify AI</h1><p>What would you like to do?</p><div id="aib"></div></div></div>
 
<div id="og" hidden><canvas id="ogv"></canvas><div id="ogf"></div><div id="ogt"></div><button id="ogx" aria-label="Exit">&#10005;</button><div id="ogh"></div>
<div id="ogc"><div id="ogm"></div><div class="r"><input id="ogi" placeholder="Say something..." maxlength="60" autocomplete="off"><button id="ogs">&#10148;</button></div></div>
<div id="ogd"><button data-k="up" style="grid-area:1/2">&#9650;</button><button data-k="left" style="grid-area:2/1">&#9664;</button><button data-k="right" style="grid-area:2/3">&#9654;</button><button data-k="down" style="grid-area:3/2">&#9660;</button></div>
<button id="ogj" data-k="jump">JUMP</button><div id="ogw" hidden></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,GoogleAuthProvider,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDoc,collection,onSnapshot,addDoc,query,orderBy,limit,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import*as THREE from"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
/* PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web) */
const cfg={apiKey:"AIzaSyARZQEdyzZZ-WqzYuDCQxFOg_QQyE7T_uM",authDomain:"blokify-49649.firebaseapp.com",projectId:"blokify-49649",storageBucket:"blokify-49649.firebasestorage.app",messagingSenderId:"983546804021",appId:"1:983546804021:web:3de1138b45f17af50fbe7c"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const I={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',grid:'<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',bag:'<path d="M5 8h14l-1 13H6zM9 8a3 3 0 016 0"/>',chat:'<path d="M4 4h16v12H9l-5 4z"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',bell:'<path d="M6 17v-6a6 6 0 0112 0v6l2 2H4zM10 21h4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'};
$$('[data-i]').forEach(e=>e.insertAdjacentHTML('afterbegin',`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${I[e.dataset.i]}</svg>`));
const show=id=>$$('.v').forEach(v=>v.hidden=v.id!==id);
let n=1;setInterval(()=>$('#ld').textContent='Loading'+'.'.repeat(n=n%3+1),1000);
$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
/* birthday + gender */
const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],op=(a,t)=>`<option value="">${t}</option>`+a.map(x=>`<option>${x}</option>`).join('');
$('#bm').innerHTML=op(mo,'Month');$('#bd').innerHTML=op([...Array(31)].map((_,i)=>i+1),'Day');
$('#by').innerHTML=op([...Array(25)].map((_,i)=>new Date().getFullYear()-i),'Year');
let gen='';$$('#gd button').forEach(b=>b.onclick=()=>{const g=b.dataset.g;if(g==='developer'&&gen!=='developer'&&prompt('Enter the developer code')!=='2223'){alert('Wrong code');return}gen=gen===g?'':g;$$('#gd button').forEach(x=>x.classList.toggle('on',x.dataset.g===gen))});
/* data */
const GAMES=[['Block Town','Life Simulator','#3b82f6','#06b6d4'],['Island Survival','Survival','#16a34a','#65a30d'],['Obby Rush','Obby','#f97316','#ef4444'],['Pet Park','Simulator','#ec4899','#f59e0b'],['Sky Racers','Racing','#6366f1','#0ea5e9'],['Build Land','Building','#a16207','#facc15'],['Fashion Fun','Fashion','#d946ef','#fb7185'],['Maze Quest','Puzzle','#0d9488','#22d3ee']];
const CATS=['Life Simulator','Survival','Roleplay','Obby','Adventure','Racing','Building','Puzzle','Sports','Simulator','Fashion','Tycoon','Art & Creativity','Music','Fun & Party'];
let A={skin:'#ffd966',shirt:'#2563eb',pants:'#334155',hat:'',head:'box'},user=null,prof=null;
const card=g=>`<div class="gc" data-game="${g[0]}"><div class="th" style="background:linear-gradient(135deg,${g[2]},${g[3]})">${g[0][0]}</div><b>${g[0]}</b></div>`;
const err=(id,m)=>$('#'+id).textContent=m;
/* auth */
const E={'auth/email-already-in-use':'That username is taken','auth/invalid-credential':'Wrong username or password','auth/wrong-password':'Wrong username or password','auth/user-not-found':'Wrong username or password','auth/network-request-failed':'No internet connection','auth/operation-not-allowed':'This sign-in method is not turned on in Firebase','auth/unauthorized-domain':'This website is not in Firebase authorized domains','auth/popup-closed-by-user':'Sign-in was cancelled'};
const msg=e=>E[e.code]||('Error: '+(e.code||e.message));
async function gl(id){try{const c=await signInWithPopup(auth,new GoogleAuthProvider());user=c.user;let p=(await getDoc(doc(db,'users',user.uid))).data();if(!p){p={username:'Player'+user.uid.slice(-4),birthday:'',gender:'',avatar:A};await setDoc(doc(db,'users',user.uid),p)}prof=p;enter()}catch(e){err(id,msg(e))}}
$('#gw').onclick=()=>gl('we');
const em=u=>u.toLowerCase()+'@blokify.app';
$('#sg').onclick=async()=>{const u=$('#su').value.trim(),p=$('#sp').value,m=$('#bm').value,d=$('#bd').value,y=$('#by').value;
if(!/^[A-Za-z0-9_]{3,16}$/.test(u))return err('se','Username: 3-16 letters, numbers or _');
if(p.length<8)return err('se','Password needs at least 8 characters');if(!m||!d||!y)return err('se','Pick your birthday');
try{const c=await createUserWithEmailAndPassword(auth,em(u),p);prof={username:u,birthday:`${y}-${mo.indexOf(m)+1}-${d}`,gender:gen,dev:gen==='developer',avatar:A};await setDoc(doc(db,'users',c.user.uid),prof);user=c.user;enter()}
catch(e){err('se',msg(e))}};
$('#lg').onclick=async()=>{try{const c=await signInWithEmailAndPassword(auth,em($('#lu').value.trim()),$('#lp').value);user=c.user;prof=(await getDoc(doc(db,'users',user.uid))).data();enter()}catch(e){err('le',msg(e))}};
/* app shell */
function enter(){if(prof?.theme)setTheme(prof.theme,1);setTimeout(chk,800);if(prof?.avatar)A={...A,...prof.avatar};$('#nm').textContent=prof?.username||'Player';$('.av').style.background=A.skin;show('app');go('home')}
const mn=$('#mn');let cur='home',cat='';
function go(r){cur=r;$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));
if(r==='home')mn.innerHTML=`<h2>Recommended For You</h2><div class="rw">${GAMES.map(card).join('')}</div><h2>Popular</h2><div class="rw">${[...GAMES].reverse().map(card).join('')}</div>`;
else if(r==='cats')mn.innerHTML=`<h2>Categories</h2><div class="chips">${CATS.map(c=>`<button data-c="${c}" class="${c===cat?'on':''}">${c}</button>`).join('')}</div><div class="gg">${GAMES.filter(g=>!cat||g[1]===cat).map(card).join('')||'<p style="color:var(--mu)">No games here yet.</p>'}</div>`;
else if(r==='mall')mall();else if(r==='set')sett();else if(r==='prof')profile();
else mn.innerHTML=`<h2>${{msg:'Messages',create:'Create',set:'Settings',prof:'Profile'}[r]}</h2><p style="color:var(--mu)">Coming soon.</p>`}
$('#nav').onclick=e=>{const b=e.target.closest('button');b&&go(b.dataset.r)};
$('#pf').onclick=()=>go('prof');$('#gr2').onclick=()=>go('set');
$('#bl').onclick=()=>pop('<h2 style="text-align:center">Notifications</h2><p style="text-align:center;color:#ccc">No notifications yet.</p>');
$('#sb').onclick=()=>{pop('<input id="q" placeholder="Search games" autofocus><div class="gg" id="qr" style="justify-content:center"></div>');$('#q').oninput=e=>{const v=e.target.value.toLowerCase();$('#qr').innerHTML=v?GAMES.filter(g=>g[0].toLowerCase().includes(v)).map(card).join(''):''}};
function pop(h){const p=$('#pp');p.innerHTML=h;p.hidden=false}
$('#pp').onclick=e=>{if(e.target.id==='pp'&&!e.target.dataset.hard)e.target.hidden=true};
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cat=cat===c.dataset.c?'':c.dataset.c;go('cats')}
const g=e.target.closest('[data-game]');if(g){$('#pp').hidden=true;$('#aip').hidden=true;const x=GAMES.find(y=>y[0]===g.dataset.game);
mn.innerHTML=`<div class="gh" style="background:linear-gradient(135deg,${x[2]}66,${x[3]}66)"><div class="th" style="background:linear-gradient(135deg,${x[2]},${x[3]})">${x[0][0]}</div><h2>${x[0]}</h2><button class="big gr play">PLAY</button><div class="chips" style="justify-content:center"><button>Favorite</button><button>Notify me</button></div></div><div class="chips" style="margin-top:14px"><button>Servers</button><button>Versions</button><button>Events</button></div>`}});
/* mall */
const sw=(k,a)=>a.map(c=>({k,v:c}));
const CH=[['bunny','Bunny Girl'],['denim','Denim Kid'],['jacket','Blue Jacket Kid'],['jacketR','Red Jacket Kid'],['cat1','Orange Cat'],['cat2','Patch Cat'],['cat3','Black Cat'],['cat4','Spotted Cat']],
HATS=[['shark1','Shark Hat (Chomping)',.6],['shark2','Shark Hat (Mouth Open)',.6],['turtle1','Turtle Hat (Swimming)',.6],['turtle2','Turtle Hat',.6],['farmer','Farmer Hat',.5],['lab','Lab Top Hat',.5]],
FKS=[['smile','Smiley'],['grin','Laughing'],['wink','Wink'],['cool','Cool'],['tongue','Silly'],['wow','Surprised'],['sad','Sad'],['angry','Angry']],

w.hidden=false;w.innerHTML=`<h2>🏆 You finished Obby Rush!</h2><p>Time ${fmt(t)} · Falls ${og.deaths}<br>Best ${fmt(n.best)} · Wins ${n.wins}</p><button class="big gr" id="oga">Play again</button><button class="big bl" id="ogb">Exit</button>`;
$('#oga').onclick=startObby;$('#ogb').onclick=closeObby;if(prof&&user){prof.obby=n;try{await setDoc(doc(db,'users',user.uid),{obby:n},{merge:true})}catch(e){}}}
function step(dt){const P=og.p,V=og.v,L=og.L;og.t+=dt;if(!og.fin)og.time+=dt;
for(const b of L.mov){const n=b.x0+Math.sin(og.t*b.sp+b.ph)*b.amp;b.dx=n-b.x;b.x=n;b.m.position.x=n}
for(const b of L.dis)if(b.t>=0){b.t+=dt;if(b.t>.7&&b.on){b.on=0;b.m.visible=false}if(b.t>3.5){b.t=-1;b.on=1;b.m.visible=true}}
for(const s of L.spin){s.a+=dt*s.sp;s.m.rotation.y=s.a}
const f=(K.up?1:0)-(K.down?1:0),r=(K.right?1:0)-(K.left?1:0);let mx=0,mz=0;
if(f||r){const l=Math.hypot(f,r),c=Math.cos(og.yaw),s=Math.sin(og.yaw);mx=(-s*f+c*r)/l;mz=(-c*f-s*r)/l}
const k=Math.min(1,dt*(og.gr?16:6));V.x+=(mx*8-V.x)*k;V.z+=(mz*8-V.z)*k;og.jb-=dt;og.coy-=dt;
if(og.jb>0&&og.coy>0){V.y=14;og.jb=0;og.coy=0}V.y=Math.max(-45,V.y-38*dt);
if(og.st&&og.st.dx)P.x+=og.st.dx;
const py=P.y;P.x+=V.x*dt;P.z+=V.z*dt;P.y+=V.y*dt;og.gr=0;og.st=null;
for(const b of L.solid){if(!b.on)continue;const ox=b.w/2+.3-Math.abs(P.x-b.x),oz=b.d/2+.3-Math.abs(P.z-b.z);if(ox<=0||oz<=0)continue;
if(py>=b.top-.15&&P.y<=b.top&&V.y<=0){P.y=b.top;V.y=0;og.gr=1;og.st=b;if(b.dsp&&b.t<0)b.t=0;
if(b.ci>og.cp){og.cp=b.ci;homeBots();toast(b.fin?'🏁 Finish!':'✅ Checkpoint!')}if(b.fin)win()}
else if(P.y<b.top-.1&&P.y+2.1>b.top-b.h){if(ox<oz){P.x+=(P.x>b.x?1:-1)*ox;V.x=0}else{P.z+=(P.z>b.z?1:-1)*oz;V.z=0}}}
if(og.gr)og.coy=.12;
for(const b of L.kill)if(Math.abs(P.x-b.x)<b.w/2+.2&&Math.abs(P.z-b.z)<b.d/2+.2&&P.y<b.top+.1&&P.y+2>b.top-b.h)die();
for(const s of L.spin){const dx=P.x-s.x,dz=P.z-s.z,c=Math.cos(s.a),n=Math.sin(s.a);if(Math.abs(dx*c-dz*n)<s.len/2+.2&&Math.abs(dx*n+dz*c)<.6&&P.y<s.top+.9&&P.y+2>s.top+.4)die()}
if(P.y<-14)die();if(net)netTick(dt);
og.pg.position.set(P.x,P.y+FO,P.z);if(Math.hypot(V.x,V.z)>1)og.pg.rotation.y=Math.atan2(V.x,V.z);
og.bots.forEach((b,i)=>{const tx=b.hx+Math.cos(og.t*.4+i*.8)*3.5,tz=b.hz+Math.sin(og.t*.35+i*1.3)*3.2,g=b.g.position,dx=tx-g.x,dz=tz-g.z;g.x+=dx*Math.min(1,dt*1.5);g.z+=dz*Math.min(1,dt*1.5);g.y=b.hy+FO+Math.max(0,Math.sin(og.t*3+i*2))*.35;b.g.rotation.y=Math.atan2(dx,dz)});
 
const D=10,cs=Math.cos(og.pitch);og.cam.position.set(P.x+Math.sin(og.yaw)*cs*D,P.y+1.5+Math.sin(og.pitch)*D,P.z+Math.cos(og.yaw)*cs*D);og.cam.lookAt(P.x,P.y+1.3,P.z);
$('#ogh').textContent='Stage '+Math.min(og.cp+1,6)+'/6  ⏱ '+fmt(og.time)+'  💀 '+og.deaths}
function loop(now){if(!og||!og.on)return;raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-og.last)/1000||.016);og.last=now;step(dt);hatTick();ogR.render(og.S,og.cam)}
function startObby(){netStop();cancelAnimationFrame(raf);if(!ogR)ogR=new THREE.WebGLRenderer({canvas:$('#ogv'),antialias:true});ogR.setPixelRatio(Math.min(devicePixelRatio,2));ogR.setSize(innerWidth,innerHeight,false);
const S=new THREE.Scene();S.background=(()=>{const c=document.createElement('canvas');c.width=2;c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);g.addColorStop(0,'#3d9bff');g.addColorStop(1,'#cdeeff');x.fillStyle=g;x.fillRect(0,0,2,256);return new THREE.CanvasTexture(c)})();S.fog=new THREE.Fog('#bfe6ff',80,240);S.add(new THREE.HemisphereLight(0xffffff,0x8899bb,1.6));const sn=new THREE.DirectionalLight(0xffffff,1.3);sn.position.set(30,60,20);S.add(sn);
const lv=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshBasicMaterial({color:'#ff7a8a'}));lv.rotation.x=-Math.PI/2;lv.position.y=-16;S.add(lv);
const cm=new THREE.MeshLambertMaterial({color:'#fff'});for(let i=0;i<22;i++){const c=new THREE.Group();[[0,0,5],[4.5,-.8,3.8],[-4.5,-.8,3.8],[2,1.4,3.5]].forEach(p=>{const q=new THREE.Mesh(new THREE.SphereGeometry(p[2],12,8),cm);q.position.set(p[0],p[1],0);c.add(q)});c.scale.set(1,.55,.8);c.position.set((i%2?1:-1)*(30+i%5*9),24+i%3*6,-i*14);S.add(c)}const su=new THREE.Mesh(new THREE.SphereGeometry(10,16,12),new THREE.MeshBasicMaterial({color:'#fff3a0',fog:false}));su.position.set(-60,70,-120);S.add(su);
const L=buildObby(S),pg=avActor({...A0,...A},prof?.username||'You');S.add(pg);
og={on:1,S,L,pg,cam:new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,400),p:{x:0,y:0,z:0},v:{x:0,y:0,z:0},yaw:0,pitch:.45,cp:0,t:0,time:0,deaths:0,gr:0,coy:0,jb:0,bt:3,fin:0,st:null,last:performance.now(),
bots:[]};
homeBots();OG.hidden=false;$('#ogw').hidden=true;$('#ogc').hidden=noChat();$('#ogm').innerHTML='';feed('Blokify','Welcome to Obby Rush! Reach the finish 🏁','#ffd166');raf=requestAnimationFrame(loop);netStart('obby-main')}
function closeObby(){netStop();if(og)og.on=0;og=null;cancelAnimationFrame(raf);OG.hidden=true;for(const k in K)K[k]=0}
$('#ogx').onclick=closeObby;$('#ogs').onclick=send;$('#ogi').onkeydown=e=>{if(e.key==='Enter')send()};
$$('#og [data-k]').forEach(b=>{const k=b.dataset.k,on=v=>e=>{e.preventDefault();K[k]=v;if(v&&k==='jump'&&og)og.jb=.15};b.onpointerdown=on(1);b.onpointerup=b.onpointercancel=b.onpointerleave=on(0);b.oncontextmenu=e=>e.preventDefault()});
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump'};
addEventListener('keydown',e=>{if(!og||e.target.tagName==='INPUT')return;const k=KM[e.code];if(k){K[k]=1;if(k==='jump')og.jb=.15;e.preventDefault()}});addEventListener('keyup',e=>{const k=KM[e.code];if(k)K[k]=0});
let sp=null;const cv=$('#ogv');cv.onpointerdown=e=>{sp=e.pointerId;cv.setPointerCapture(e.pointerId);if(og){og.lx=e.clientX;og.ly=e.clientY}};
cv.onpointermove=e=>{if(sp!==e.pointerId||!og)return;og.yaw-=(e.clientX-og.lx)*.006;og.pitch=Math.max(.08,Math.min(1.35,og.pitch+(e.clientY-og.ly)*.005));og.lx=e.clientX;og.ly=e.clientY};cv.onpointerup=cv.onpointercancel=()=>sp=null;
addEventListener('resize',()=>{if(og){ogR.setSize(innerWidth,innerHeight,false);og.cam.aspect=innerWidth/innerHeight;og.cam.updateProjectionMatrix()}});
document.addEventListener('click',e=>{if(!e.target.closest('.play'))return;$('#mn .gh h2')?.textContent==='Obby Rush'?startObby():alert('This game is coming soon!')});
/* start: wait for auth + 6 seconds */
const ready=new Promise(r=>onAuthStateChanged(auth,async u=>{user=u;if(u)try{prof=(await getDoc(doc(db,'users',u.uid))).data()}catch(e){}r()},()=>r()));
await Promise.all([ready,new Promise(r=>setTimeout(r,6000))]);
user?enter():show('welcome');
</script></body></html>
