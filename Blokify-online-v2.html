<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blokify</title>
<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:#fff}
[hidden]{display:none!important}.v{min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}

#load .logo{font-size:clamp(44px,12vw,90px)}#ld{position:fixed;bottom:12vh;color:#555}
.au{max-width:420px;margin:0 auto;padding:40px 22px;text-align:center}.au .logo{font-size:52px}.au h3{color:var(--t);margin:6px 0 22px}

input,select{width:100%;padding:14px;border-radius:12px;border:1px solid var(--ln);background:#0e1420;color:#fff;font:inherit;margin:6px 0}
label{display:block;text-align:left;font-size:14px;color:var(--mu);margin-top:10px}.row{display:flex;gap:8px}.er{color:#ff7a7a;min-height:20px;font-size:14px}
.gd button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--ln);background:#0e1420}.gd .on{border-color:var(--t);color:var(--t)}
.back{background:none;border:0;font-size:26px;float:left}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--ln)}header .logo{font-size:22px}
#sb{flex:1;text-align:left;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;color:var(--mu)}
.ib{background:none;border:0}.me{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:700}.av{width:34px;height:34px;border-radius:50%;background:#f5c9a0;border:2px solid var(--t)}
.lay{display:flex;min-height:calc(100vh - 57px)}nav{width:170px;padding:12px;border-right:1px solid var(--ln)}

.gc{flex:0 0 130px;cursor:pointer}.th{aspect-ratio:1;border-radius:22px;display:flex;align-items:flex-end;padding:8px;font-size:34px;font-weight:900;color:#ffffff66}.gc b{display:block;margin-top:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:9px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--cd)}.chips .on{background:var(--t);color:#062}
.gg{display:grid;grid-template-columns:repeat(auto-fill,130px);gap:14px;margin-top:14px}
.ml{display:flex;gap:16px;flex-wrap:wrap}.mt{width:150px}.mt button{display:block;width:100%;padding:11px;margin-bottom:4px;border:0;border-radius:10px;background:none;text-align:left}.mt .on{background:var(--cd);color:var(--t)}
.mc{flex:1;min-width:240px}.it{display:grid;grid-template-columns:repeat(auto-fill,92px);gap:10px}.it button{border:2px solid var(--ln);border-radius:14px;background:var(--cd);padding:6px;font-size:12px}.it .on{border-color:var(--t)}.it i{display:block;height:52px;border-radius:8px;margin-bottom:4px}
.pv{width:260px}#cv{width:100%;height:340px;background:var(--cd);border-radius:18px}
.gh{border-radius:22px;padding:30px 16px;text-align:center}.gh .th{width:150px;margin:0 auto 10px}.play{width:220px}.pop{position:fixed;inset:0;background:#000b;z-index:9;padding:60px 18px}.pop input{max-width:520px;display:block;margin:0 auto 18px}
@media(max-width:700px){.lay{flex-direction:column-reverse}nav{width:100%;display:flex;border:0;border-top:1px solid var(--ln);position:sticky;bottom:0;background:var(--bg);padding:6px}nav button{flex-direction:column;font-size:11px;gap:2px;justify-content:center;text-align:center}.me span{display:none}}
.st{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}.st small{display:block;color:var(--mu)}
.tg{width:52px;height:30px;border-radius:15px;border:0;background:#334155;position:relative;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on:after{left:25px}
.it img{display:block;width:100%;height:80px;object-fit:contain;background:#0e1420;border-radius:8px;margin-bottom:4px}.it{grid-template-columns:repeat(auto-fill,100px)!important}
</style></head><body>

try{const c=await createUserWithEmailAndPassword(auth,em(u),p);prof={username:u,birthday:`${y}-${mo.indexOf(m)+1}-${d}`,gender:gen,avatar:A};await setDoc(doc(db,'users',c.user.uid),prof);user=c.user;enter()}

$('#pp').onclick=e=>{if(e.target.id==='pp'&&!e.target.dataset.hard)e.target.hidden=true};
document.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cat=cat===c.dataset.c?'':c.dataset.c;go('cats')}
const g=e.target.closest('[data-game]');if(g){$('#pp').hidden=true;const x=GAMES.find(y=>y[0]===g.dataset.game);
mn.innerHTML=`<div class="gh" style="background:linear-gradient(135deg,${x[2]}66,${x[3]}66)"><div class="th" style="background:linear-gradient(135deg,${x[2]},${x[3]})">${x[0][0]}</div><h2>${x[0]}</h2><button class="big gr play">PLAY</button><div class="chips" style="justify-content:center"><button>Favorite</button><button>Notify me</button></div></div><div class="chips" style="margin-top:14px"><button>Servers</button><button>Versions</button><button>Events</button></div>`}});

const TABS={Characters:sw('skin',['#f5c9a0','#c68642','#8d5524','#ffd966','#7ec8e3','#a3e635','#f9a8d4']),
Clothing:[...sw('shirt',['#2563eb','#ef4444','#22c55e','#facc15','#a855f7','#111827','#ffffff']),...sw('pants',['#334155','#1e3a8a','#78350f','#111827','#166534'])],
Accessories:[{k:'hat',v:''},...sw('hat',['#ef4444','#2563eb','#facc15','#111827','#22c55e'])],

/* settings */

setInterval(()=>{if(!prof||!user||document.hidden)return;const s=prof.settings=prof.settings||{avoid:1,filter:1,ai:1},d=new Date().toDateString();if(s.day!==d){s.day=d;s.used=0}s.used=(s.used||0)+1;sv2();chk()},60000);
async function sett(){const s=prof.settings=prof.settings||{avoid:1,filter:1,ai:1},b=(prof.birthday||'').split('-').map(Number),age=b[0]?Math.floor((Date.now()-new Date(b[0],b[1]-1,b[2]))/31557600000):'-';
mn.innerHTML=`<h2>Settings</h2><h3>Account Info</h3><label>Username</label><div class="row"><input id="un" value="${prof.username||''}"><button class="big gr" id="unb" style="width:110px;margin:6px 0">Save</button></div><div class="er" id="une"></div><p style="color:var(--mu)">Birthday: ${prof.birthday||'-'} &middot; Age: ${age} &middot; Gender: ${prof.gender||'-'}<br>Most played games: none yet</p>${SET.map(g=>`<h3>${g[0]}</h3>${g[1].map(x=>`<div class="st"><div><b>${x[1]}</b><small>${x[2]}</small></div><button class="tg${s[x[0]]?' on':''}" data-k="${x[0]}"></button></div>`).join('')}`).join('')}${s.limit?`<label>Daily limit (minutes)</label><input id="mn2" type="number" min="5" value="${s.mins||60}">`:''}<h3>Spending Time</h3><p style="color:var(--mu)">Today: ${s.used||0} minutes</p>`;
$('#unb').onclick=async()=>{const v=$('#un').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(v))return err('une','Username: 3-16 letters, numbers or _');prof.username=v;$('#nm').textContent=v;await sv2();err('une','Saved!')};
if($('#mn2'))$('#mn2').onchange=async e=>{if(!await pin())return sett();s.mins=Math.max(5,+e.target.value||60);await sv2()};
$$('.tg').forEach(t=>t.onclick=async()=>{const k=t.dataset.k;if(!await pin())return;
if(k==='lock'&&!s.lock){const p=prompt('Choose a 4-digit PIN');if(!/^\d{4}$/.test(p||''))return alert('The PIN must be 4 numbers');s.pin=await sha(p);s.lock=1}else s[k]=s[k]?0:1;await sv2();sett()})}
/* start: wait for auth + 6 seconds */
const ready=new Promise(r=>onAuthStateChanged(auth,async u=>{user=u;if(u)try{prof=(await getDoc(doc(db,'users',u.uid))).data()}catch(e){}r()},()=>r()));
await Promise.all([ready,new Promise(r=>setTimeout(r,6000))]);
user?enter():show('welcome');
</script></body></html>
